name: Bug report
description: Something in Snap Translate isn't working as expected
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Snap Translate!
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the problem and what you expected to happen.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
        3. ...
  - type: upload
    id: log
    attributes:
      label: Log file
      description: |
        The log file `error.log` is in the Snap Translate folder. To upload it:
        1. Copy the folder path:
           ```text
           %LOCALAPPDATA%\SnapTranslate
           ```
        2. Click the box below. A file window opens.
        3. Paste the path into the **File name** field and press **Enter**. The folder opens.
        4. Select `error.log` and click **Open**.

        Or press **Win+R**, paste the path, press **Enter**, and drag `error.log` from the folder that opens into the box below.
    validations:
      required: true
      accept: ".log,.txt"
  - type: textarea
    id: environment
    attributes:
      label: System details
      description: Filled in automatically by the app.
      render: text
    validations:
      required: true
